name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pytest · ruff · mypy（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 版本钉死（见 requirements-dev.txt）：上游发新版即破 CI 的问题已经踩过一次
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check pet/ tests/
      - name: core 边界检查（只允许 stdlib + core 内部依赖）
        shell: bash
        run: |
          if grep -rEn "^[[:space:]]*(import|from)[[:space:]]+(AppKit|Foundation|Quartz|CoreFoundation|tkinter|winsound|PIL|requests|urllib)" pet/core/; then
            echo "::error pet/core 只能依赖 stdlib + core 内部模块（见 ARCHITECTURE.md §3.3）"
            exit 1
          fi
      - name: mypy（增量，先绿后严）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then target=pet_mac.py; else target=pet.pyw; fi
          cd pet && mypy "$target" launch.py setup.py theme_cli.py core/ platforms/ theme/
      - name: pytest（= 平台冒烟：导入被测模块即覆盖平台依赖）
        run: python -m pytest -v

  ts:
    name: tsc --noEmit（hooks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 类型检查 hooks/
        run: npm exec --yes --package=typescript@5.6 -- tsc -p hooks
      # node 22 需显式 --experimental-strip-types 才会执行 .ts 测试；
      # 且 --test 的目录参数在 22 上会把目录当模块加载（MODULE_NOT_FOUND），
      # 用 shell glob 展开成显式文件列表，22/26 行为一致
      - name: hooks 单测（node:test）
        run: node --test --experimental-strip-types hooks/*.test.ts hooks/*.test.mjs
