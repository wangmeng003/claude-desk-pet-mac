[project]
name = "desk-pet"
version = "0.2.1"
description = "Claude 娘桌宠悬浮窗 + Token/缓存命中率状态栏 + 完成提示音"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Step 0 只锁定行为不收敛风格：最小规则集（存量 fail-open except 是刻意设计）。
# BLE/S/PLW 等严格规则等 Step 1/2 重构后单独评估。
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
